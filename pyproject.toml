[project]
name = "market-signals"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arch>=8.0.0",
    "cot-reports>=0.1.3",
    "duckdb>=1.5.6",
    "feedparser>=6.0.14",
    "fredapi>=0.5.2",
    "lightgbm>=4.7.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pandera>=0.34.0",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "shap>=0.52.0",
    "streamlit>=1.65.0",
    "tabulate>=0.10.0",
    "tzdata>=2026.5",
    "xlrd>=2.0.2",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["data: testy na prawdziwej bazie data/market.duckdb"]
